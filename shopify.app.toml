# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9f77ba5672b593f4e6a5d32d2093e460"
name = "Textile Studio Lab"
application_url = "https://textile-studio-production.up.railway.app"
embedded = true

[webhooks]
api_version = "2026-01"

# Audit B8 — déclarations statiques exigées par Shopify review depuis 2024
[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/shopify/webhook"

# Webhooks de conformité GDPR (obligatoires App Store) — une URL par topic,
# pointant vers les endpoints existants de routes/shopify.js (aucun changement de code).
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "https://textile-studio-production.up.railway.app/shopify/gdpr/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "https://textile-studio-production.up.railway.app/shopify/gdpr/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "https://textile-studio-production.up.railway.app/shopify/gdpr/shop/redact"

# orders/paid — ajouté en statique le 09/06/2026 (bootstrap désactivé en prod depuis audit M8)
[[webhooks.subscriptions]]
topics = ["orders/paid"]
uri = "/shopify/webhook"

[app_proxy]
url = "https://textile-studio-production.up.railway.app/proxy"
subpath = "textilelab"
prefix = "apps"

[access_scopes]
# write_products (rétabli 06/2026) : REQUIS par la personnalisation tarifée —
#   l'app ajoute une option « Impression » et crée des variantes pré-tarifées
#   (surcharge d'impression incluse) pour garder UNE seule ligne panier au prix
#   exact, sans Shopify Plus. Cf. routes/storefront.js (prepare-customization +
#   resolveVariantForCustomization, stratégie C).
# write_orders   : aucune mutation order dans le code → non demandé.
# read_customers : non nécessaire, Shopify fournit l'email dans le payload GDPR.
scopes = "read_products,read_orders,write_products"

[auth]
redirect_urls = [
  "https://textile-studio-production.up.railway.app/oauth/callback"
]

[pos]
embedded = false
