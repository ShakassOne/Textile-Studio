# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9f77ba5672b593f4e6a5d32d2093e460"
name = "Textile Studio Lab"
application_url = "https://textile-studio-production.up.railway.app"
embedded = true

[webhooks]
api_version = "2026-01"

# Audit B8 — déclarations statiques exigées par Shopify review depuis 2024
[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/shopify/webhook"

# Webhooks de conformité GDPR (obligatoires App Store) — une URL par topic,
# pointant vers les endpoints existants de routes/shopify.js (aucun changement de code).
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "https://textile-studio-production.up.railway.app/shopify/gdpr/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "https://textile-studio-production.up.railway.app/shopify/gdpr/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "https://textile-studio-production.up.railway.app/shopify/gdpr/shop/redact"

# orders/paid : contient des données client protégées → enregistré dynamiquement au
# bootstrap (server.js) une fois l'app installée (PCD demandé via le Dev Dashboard).

[app_proxy]
url = "https://textile-studio-production.up.railway.app/proxy"
subpath = "textilelab"
prefix = "apps"

[access_scopes]
# Audit B7 — principe du moindre privilège : write_products/write_orders/read_customers retirés
# write_products : non utilisé dans le flow merchant principal (feature admin optionnelle)
# write_orders   : aucune mutation order dans le code
# read_customers : non nécessaire, Shopify fournit l'email dans le payload GDPR directement
scopes = "read_products,read_orders"

[auth]
redirect_urls = [
  "https://textile-studio-production.up.railway.app/oauth/callback"
]

[pos]
embedded = false
